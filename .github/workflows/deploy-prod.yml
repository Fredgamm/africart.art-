# Déploiement automatique vers la prod o2switch (arancia.o2switch.net) par FTPS.
# Se lance à chaque push sur main (donc à chaque fusion d'une PR), ou à la main depuis l'onglet Actions.
#
# Règle : on n'écrase JAMAIS sans accord un fichier modifié sur le serveur.
#   1. On télécharge la version actuelle du serveur (lecture seule).
#   2. On compare serveur / dépôt / dernière version déployée (.github/scripts/verifier_ecrasement.py).
#   3. Si un fichier a été modifié sur le serveur : arrêt, rien n'est envoyé, liste dans le résumé.
#      Pour écraser quand même : Actions > « Déploiement prod » > Run workflow, ecraser = oui.
# Rien n'est supprimé sur le serveur en dehors des fichiers venant du dépôt.
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   FTP_USERNAME     compte FTP
#   FTP_PASSWORD     mot de passe de ce compte
#   FTP_WP_CONTENT   chemin du dossier wp-content vu par ce compte FTP, terminé par /
#                    pour africart.art : /runabac.art/wp-content/

name: Déploiement prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ecraser:
        description: "Écraser les fichiers modifiés sur le serveur ? (après avoir lu la liste des conflits)"
        type: choice
        options: [non, oui]
        default: non

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: arancia.o2switch.net
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_WP_CONTENT: ${{ secrets.FTP_WP_CONTENT }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      # Le secret est souvent collé avec un espace ou un retour à la ligne invisible,
      # ou sans le / final : on le nettoie ici. Le garde-fou voxel-child plus bas
      # vérifie ensuite qu'on est bien dans le wp-content d'africart.art.
      - name: Normaliser le chemin du serveur
        run: |
          d=$(printf '%s' "$FTP_WP_CONTENT" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          [ -n "$d" ] || { echo "::error::Secret FTP_WP_CONTENT vide."; exit 1; }
          case "$d" in /*) ;; *) d="/$d";; esac
          case "$d" in */) ;; *) d="$d/";; esac
          [ "$d" = "$FTP_WP_CONTENT" ] || echo "::notice::Chemin FTP_WP_CONTENT nettoyé (espaces, retour à la ligne ou / ajouté)."
          echo "FTP_WP_CONTENT=$d" >> "$GITHUB_ENV"

      # ⚠️ Le FTP d'o2switch n'envoie que son propre certificat, sans les intermédiaires
      # Let's Encrypt (YR1 -> Root YR, croisé par ISRG Root X1). On les récupère via
      # l'adresse indiquée dans le certificat (AIA), on VÉRIFIE que la chaîne remonte
      # à une racine du système, et seulement alors on s'en sert. Pas de vérification
      # désactivée : le mot de passe ne part que vers le vrai serveur.
      - name: Compléter la chaîne TLS du serveur FTP
        run: |
          t="$RUNNER_TEMP/tls"; mkdir -p "$t"; cd "$t"
          echo | timeout 30 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" 2>/dev/null | openssl x509 > serveur.pem
          : > intermediaires.pem; cert=serveur.pem
          for i in 1 2 3; do
            url=$(openssl x509 -in "$cert" -noout -text | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1)
            [ -n "$url" ] || break
            curl -sf --max-time 30 "$url" -o c$i.der || break
            openssl x509 -inform DER -in c$i.der -out c$i.pem 2>/dev/null || openssl x509 -in c$i.der -out c$i.pem
            cat c$i.pem >> intermediaires.pem; cert=c$i.pem
            openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted intermediaires.pem serveur.pem > /dev/null 2>&1 && break
          done
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted intermediaires.pem -verify_hostname "$FTP_HOST" serveur.pem \
            || { echo "::error::Certificat du serveur FTP non vérifiable : déploiement arrêté, rien n'a été envoyé."; exit 1; }
          cat /etc/ssl/certs/ca-certificates.crt intermediaires.pem > ca-complet.pem
          echo "FTP_CA_FILE=$t/ca-complet.pem" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$t/intermediaires.pem" >> "$GITHUB_ENV"

      - name: Télécharger la version du serveur (lecture seule)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p "$RUNNER_TEMP/serveur"
          cmds="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:ca-file '$FTP_CA_FILE'; set net:max-retries 2; set net:timeout 30; set cmd:fail-exit no;"
          cmds="$cmds cd '$FTP_WP_CONTENT' || exit 1;"
          cmds="$cmds get -O '$RUNNER_TEMP/serveur' .ftp-deploy-sync-state.json;"
          for d in $(git ls-files wp-content | cut -d/ -f2-3 | sort -u); do
            cmds="$cmds mirror --parallel=4 '$d' '$RUNNER_TEMP/serveur/$d';"
          done
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$cmds bye" "ftp://$FTP_HOST"
          # Garde-fou : on doit être dans le wp-content d'africart.art, pas dans un autre site du compte.
          if [ ! -f "$RUNNER_TEMP/serveur/themes/voxel-child/style.css" ]; then
            echo "::error::themes/voxel-child/style.css introuvable dans $FTP_WP_CONTENT : mauvais dossier ? Déploiement arrêté, rien n'a été envoyé."
            exit 1
          fi

      - name: Vérifier les fichiers modifiés sur le serveur
        run: |
          etat="$RUNNER_TEMP/serveur/.ftp-deploy-sync-state.json"
          [ -f "$etat" ] || etat="-"
          python3 .github/scripts/verifier_ecrasement.py wp-content "$RUNNER_TEMP/serveur" "$etat" "${{ inputs.ecraser || 'non' }}"

      - name: Envoyer sur o2switch (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: arancia.o2switch.net
          port: 21
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./wp-content/
          server-dir: ${{ env.FTP_WP_CONTENT }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
